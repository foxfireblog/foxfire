name: Health Check

on:
  schedule:
    - cron: "0 12 * * *"  # Daily at noon UTC (7am EST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site is live
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://foxfire.blog)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Site returned $STATUS!"
            exit 1
          fi

      - name: Check latest exploration loads
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://foxfire.blog/explorations)
          echo "Explorations page status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Explorations page returned $STATUS!"
            exit 1
          fi

      # This job has no checkout — it only curls a public URL — so gh has no git
      # remote to infer a repository from, and it does NOT fall back to
      # GITHUB_REPOSITORY. Every gh call therefore passes --repo explicitly.
      # Without it these two steps failed silently for 137 runs: dedupe always
      # read "0" and auto-close never closed anything. Adding a checkout would
      # also work, but this job would then need contents: read and a clone of
      # the whole site to send one API call.
      - name: Close stale failure issues on success
        if: success()
        run: |
          gh issue list --repo "$GH_REPO" --label "automation-failure" --state open --json number,title \
            --jq '.[] | select(.title | contains("health check")) | .number' \
          | xargs -I{} gh issue close {} --repo "$GH_REPO" --comment "Auto-closed: site is healthy again as of $(date -u +%Y-%m-%d)" \
          || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Notify on failure
        if: failure()
        run: |
          EXISTING=$(gh issue list --repo "$GH_REPO" --label "automation-failure" --state open --json title \
            --jq '[.[] | select(.title | contains("health check"))] | length' || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open failure issue already exists, skipping duplicate"
          else
            gh issue create \
              --repo "$GH_REPO" \
              --title "🔴 Site health check failed ($(date -u +%Y-%m-%d))" \
              --body "$(printf '**Check:** foxfire.blog returned non-200 status\n**Run:** %s/%s/actions/runs/%s\n**Time:** %s\n' "$GH_SERVER_URL" "$GH_REPO" "$GH_RUN_ID" "$(date -u)")" \
              --label "automation-failure" \
              || echo "Could not create issue"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_SERVER_URL: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
