name: Promo Tweets

on:
  schedule:
    # 3x daily at well-spaced peak hours
    # Cron is in UTC. Target: ~3 promo posts/day (+/- 1 randomness built into script)
    - cron: "0 14 * * *"   # 14:00 UTC = 9am EST
    - cron: "0 18 * * *"   # 18:00 UTC = 1pm EST
    - cron: "0 0 * * *"    # 00:00 UTC = 7pm EST (previous day)
  workflow_dispatch: # Manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Random delay (0-30 min)
        run: |
          DELAY=$((RANDOM % 1800))
          echo "Sleeping ${DELAY}s to vary post timing..."
          sleep $DELAY

      - name: Post promo tweet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/promo-tweet.mjs

      - name: Notify on failure
        if: failure()
        run: |
          gh issue create \
            --title "🔴 ${{ github.workflow }} failed ($(date -u +%Y-%m-%d))" \
            --body "**Workflow:** ${{ github.workflow }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Time:** $(date -u)\n**Trigger:** ${{ github.event_name }}" \
            --label "automation-failure" \
            2>/dev/null || echo "Could not create issue (label may not exist yet)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
