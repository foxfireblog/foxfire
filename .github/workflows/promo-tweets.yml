name: Promo Tweets

on:
  schedule:
    # 3x daily at well-spaced peak hours
    # Cron is in UTC. Target: ~3 promo posts/day (+/- 1 randomness built into script)
    - cron: "0 14 * * *"   # 14:00 UTC = 9am EST
    - cron: "0 18 * * *"   # 18:00 UTC = 1pm EST
    - cron: "0 0 * * *"    # 00:00 UTC = 7pm EST (previous day)
  workflow_dispatch: # Manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Random delay (0-5 min)
        run: |
          DELAY=$((RANDOM % 300))
          echo "Sleeping ${DELAY}s to vary post timing..."
          sleep $DELAY

      - name: Install dependencies
        run: npm ci

      - name: Post promo tweet (with retry)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          node scripts/promo-tweet.mjs && exit 0
          echo "First attempt failed, retrying in 120s..."
          sleep 120
          node scripts/promo-tweet.mjs

      - name: Commit promo state
        run: |
          git config user.name "Foxfire Auto-Explore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet scripts/.promo-state.json || (git add scripts/.promo-state.json && git commit -m "Update promo state" && git push)
        continue-on-error: true

      - name: Close stale failure issues on success
        if: success()
        run: |
          gh issue list --label "automation-failure" --state open --json number,title \
            --jq '.[] | select(.title | contains("Promo Tweets")) | .number' \
          | xargs -I{} gh issue close {} --comment "Auto-closed: workflow succeeded on $(date -u +%Y-%m-%d)" \
          2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          EXISTING=$(gh issue list --label "automation-failure" --state open --json title \
            --jq '[.[] | select(.title | contains("Promo Tweets"))] | length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open failure issue already exists, skipping duplicate"
          else
            gh issue create \
              --title "🔴 ${{ github.workflow }} failed ($(date -u +%Y-%m-%d))" \
              --body "**Workflow:** ${{ github.workflow }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Time:** $(date -u)\n**Trigger:** ${{ github.event_name }}" \
              --label "automation-failure" \
              2>/dev/null || echo "Could not create issue (label may not exist yet)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
