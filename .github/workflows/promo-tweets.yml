name: Promo Tweets

on:
  schedule:
    # 1x daily — conserve X API credits
    - cron: "0 15 * * *"   # 15:00 UTC = 10am EST
  workflow_dispatch:
    inputs:
      slug:
        description: "Force a specific exploration slug (optional)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Random delay (0-5 min)
        run: |
          DELAY=$((RANDOM % 300))
          echo "Sleeping ${DELAY}s to vary post timing..."
          sleep $DELAY

      - name: Install dependencies
        run: npm ci

      - name: Post promo tweet (with retry)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          ARGS=""
          if [ -n "$INPUT_SLUG" ]; then
            ARGS="--slug=$INPUT_SLUG"
          fi
          node scripts/promo-tweet.mjs $ARGS && exit 0
          echo "First attempt failed, retrying in 120s..."
          sleep 120
          node scripts/promo-tweet.mjs $ARGS

      - name: Commit promo state
        run: |
          git config user.name "Foxfire Auto-Explore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/.promo-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update promo state"
            for attempt in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; sleep 5; continue; }
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            echo "State file push failed after 3 attempts (non-critical)"
          fi
        continue-on-error: true

      - name: Close stale failure issues on success
        if: success()
        run: |
          gh issue list --label "automation-failure" --state open --json number,title \
            --jq '.[] | select(.title | contains("Promo Tweets")) | .number' \
          | xargs -I{} gh issue close {} --comment "Auto-closed: workflow succeeded on $(date -u +%Y-%m-%d)" \
          2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          EXISTING=$(gh issue list --label "automation-failure" --state open --json title \
            --jq '[.[] | select(.title | contains("Promo Tweets"))] | length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open failure issue already exists, skipping duplicate"
          else
            gh issue create \
              --title "🔴 ${{ github.workflow }} failed ($(date -u +%Y-%m-%d))" \
              --body "**Workflow:** ${{ github.workflow }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Time:** $(date -u)\n**Trigger:** ${{ github.event_name }}" \
              --label "automation-failure" \
              2>/dev/null || echo "Could not create issue (label may not exist yet)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
