name: Promo Tweets

on:
  schedule:
    # 8x daily, spread across peak engagement hours (EST, UTC-5 → +5 offset)
    - cron: "0 13 * * *"   # 8am EST
    - cron: "0 15 * * *"   # 10am EST
    - cron: "30 16 * * *"  # 11:30am EST
    - cron: "0 18 * * *"   # 1pm EST
    - cron: "30 19 * * *"  # 2:30pm EST
    - cron: "0 22 * * *"   # 5pm EST
    - cron: "0 0 * * *"    # 7pm EST
    - cron: "0 2 * * *"    # 9pm EST
  workflow_dispatch: # Manual trigger

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Random delay (0-30 min)
        run: |
          DELAY=$((RANDOM % 1800))
          echo "Sleeping ${DELAY}s to vary post timing..."
          sleep $DELAY

      - name: Post promo tweet
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/promo-tweet.mjs
