name: Auto-Exploration

on:
  schedule:
    # Run every 3 hours EST (midnight, 3am, 6am, 9am, noon, 3pm, 6pm, 9pm).
    # Cron is in UTC, so offset +5. The script has an 8-hour pacing gate
    # and 0-45 minute random delay, so actual posts are unpredictable.
    - cron: "0 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip pacing gate"
        required: false
        default: "true"
        type: boolean
  push:
    paths:
      - '.github/workflows/auto-explore.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name != 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Install dependencies
        run: npm ci

      # Generation is paused while the audited backlog drains. The queue holds
      # 124 posts already written and vetted (docs/backlog-audit-2026-07-27.md),
      # roughly seven months at the current cadence, and costs nothing to
      # publish. When the queue empties this falls through to the generator.
      - name: Publish from backlog queue (or generate if empty)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ "$FORCE_INPUT" = "true" ]; then
            ARGS="--force"
          fi
          REMAINING=$(node -e "try{console.log(require('./scripts/publish-queue.json').length)}catch{console.log(0)}")
          echo "Backlog queue: $REMAINING post(s) remaining."
          if [ "$REMAINING" -gt 0 ]; then
            node scripts/publish-from-queue.mjs $ARGS
          else
            echo "Queue empty — resuming generation."
            node scripts/auto-explore.mjs $ARGS
          fi

      - name: Validate build
        run: npx tsc --noEmit

      - name: Push changes (if any)
        id: push
        run: |
          git config user.name "Foxfire Auto-Explore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Fetch latest to compare
          git fetch origin main
          if git diff --quiet HEAD origin/main; then
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "pushed=true" >> $GITHUB_OUTPUT
                exit 0
              fi
              echo "Push attempt $attempt failed, fetching and rebasing..."
              git fetch origin main
              git rebase origin/main || {
                git rebase --abort 2>/dev/null || true
                sleep 10
                continue
              }
              sleep 5
            done
            echo "All push attempts failed"
            echo "pushed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Check if new exploration was published
        id: check_exploration
        if: steps.push.outputs.pushed == 'true'
        run: |
          # Search recent commits (not just HEAD) for an exploration commit
          EXPLORE_SHA=$(git log -5 --grep="^Add exploration:" --format="%H" | head -1)
          if [ -n "$EXPLORE_SHA" ]; then
            echo "is_exploration=true" >> $GITHUB_OUTPUT
            echo "explore_sha=$EXPLORE_SHA" >> $GITHUB_OUTPUT
          else
            echo "is_exploration=false" >> $GITHUB_OUTPUT
            echo "Push was not a new exploration — skipping notify/tweet"
          fi

      - name: Notify on new post
        if: steps.check_exploration.outputs.is_exploration == 'true'
        env:
          EXPLORE_SHA: ${{ steps.check_exploration.outputs.explore_sha }}
        run: |
          TITLE=$(git log -1 --pretty=%s "$EXPLORE_SHA" | sed 's/Add exploration: //')
          curl -s \
            -H "Title: New Foxfire Post" \
            -H "Tags: fire,tada" \
            -d "\"${TITLE}\" is now live on foxfire.blog" \
            ntfy.sh/foxfire-auto-explore

      - name: Tweet new post
        if: steps.check_exploration.outputs.is_exploration == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          EXPLORE_SHA: ${{ steps.check_exploration.outputs.explore_sha }}
        run: |
          SLUG=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$EXPLORE_SHA" | grep 'src/app/explorations/.*/page.tsx' | head -1 | sed 's|src/app/explorations/||;s|/page.tsx||')
          if [ -z "$SLUG" ]; then
            echo "No slug found in commit, skipping tweet"
            exit 0
          fi
          node scripts/promo-tweet.mjs --slug="${SLUG}"

      - name: Close stale failure issues on success
        if: success()
        run: |
          gh issue list --label "automation-failure" --state open --json number,title \
            --jq '.[] | select(.title | contains("Auto-Exploration")) | .number' \
          | xargs -I{} gh issue close {} --comment "Auto-closed: workflow succeeded on $(date -u +%Y-%m-%d)" \
          2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          EXISTING=$(gh issue list --label "automation-failure" --state open --json title \
            --jq '[.[] | select(.title | contains("Auto-Exploration"))] | length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open failure issue already exists, skipping duplicate"
          else
            gh issue create \
              --title "🔴 ${{ github.workflow }} failed ($(date -u +%Y-%m-%d))" \
              --body "**Workflow:** ${{ github.workflow }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Time:** $(date -u)\n**Trigger:** ${{ github.event_name }}" \
              --label "automation-failure" \
              2>/dev/null || echo "Could not create issue (label may not exist yet)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
