name: Auto-Exploration

on:
  schedule:
    # Run every 3 hours EST (midnight, 3am, 6am, 9am, noon, 3pm, 6pm, 9pm).
    # Cron is in UTC, so offset +5. The script has a 30% probability gate
    # and 0-90 minute random delay, so actual posts are unpredictable.
    - cron: "0 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run auto-explore
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/auto-explore.mjs

      - name: Push changes (if any)
        id: push
        run: |
          git config user.name "Foxfire Auto-Explore"
          git config user.email "joncrooshal@gmail.com"
          if git diff --quiet HEAD origin/main; then
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify on new post
        if: steps.push.outputs.pushed == 'true'
        run: |
          TITLE=$(git log -1 --pretty=%s | sed 's/Add exploration: //')
          curl -s \
            -H "Title: New Foxfire Post" \
            -H "Tags: fire,tada" \
            -d "\"${TITLE}\" is now live on foxfire-beige.vercel.app" \
            ntfy.sh/foxfire-auto-explore
