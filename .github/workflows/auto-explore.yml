name: Auto-Exploration

on:
  schedule:
    # Run every 3 hours EST (midnight, 3am, 6am, 9am, noon, 3pm, 6pm, 9pm).
    # Cron is in UTC, so offset +5. The script has an 8-hour pacing gate
    # and 0-90 minute random delay, so actual posts are unpredictable.
    - cron: "0 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI
  push:
    paths:
      - '.github/workflows/auto-explore.yml'

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Install dependencies
        run: npm ci

      - name: Run auto-explore
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/auto-explore.mjs

      - name: Push changes (if any)
        id: push
        run: |
          git config user.name "Foxfire Auto-Explore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet HEAD origin/main; then
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify on new post
        if: steps.push.outputs.pushed == 'true'
        run: |
          TITLE=$(git log -1 --pretty=%s | sed 's/Add exploration: //')
          curl -s \
            -H "Title: New Foxfire Post" \
            -H "Tags: fire,tada" \
            -d "\"${TITLE}\" is now live on foxfire.blog" \
            ntfy.sh/foxfire-auto-explore

      - name: Tweet new post
        if: steps.push.outputs.pushed == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          TITLE=$(git log -1 --pretty=%s | sed 's/Add exploration: //')
          SLUG=$(git diff-tree --no-commit-id --name-only -r HEAD | grep 'src/app/explorations/.*/page.tsx' | head -1 | sed 's|src/app/explorations/||;s|/page.tsx||')
          URL="https://foxfire.blog/explorations/${SLUG}"
          TWEET_TEXT=$(printf "%s\n\n%s" "${TITLE}" "${URL}")
          node scripts/tweet.mjs "${TWEET_TEXT}"
