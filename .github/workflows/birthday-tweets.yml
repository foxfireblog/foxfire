name: Birthday Tweets

on:
  schedule:
    # Run daily at 10:00 AM UTC (6 AM ET / 5 AM CT)
    - cron: "0 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  birthday-tweets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Post birthday tweets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          CI: "true"
        run: node scripts/birthday-tweet.mjs

      - name: Close stale failure issues on success
        if: success()
        run: |
          gh issue list --label "automation-failure" --state open --json number,title \
            --jq '.[] | select(.title | contains("Birthday Tweets")) | .number' \
          | xargs -I{} gh issue close {} --comment "Auto-closed: workflow succeeded on $(date -u +%Y-%m-%d)" \
          2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          EXISTING=$(gh issue list --label "automation-failure" --state open --json title \
            --jq '[.[] | select(.title | contains("Birthday Tweets"))] | length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open failure issue already exists, skipping duplicate"
          else
            gh issue create \
              --title "🔴 ${{ github.workflow }} failed ($(date -u +%Y-%m-%d))" \
              --body "**Workflow:** ${{ github.workflow }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Time:** $(date -u)\n**Trigger:** ${{ github.event_name }}" \
              --label "automation-failure" \
              2>/dev/null || echo "Could not create issue (label may not exist yet)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
