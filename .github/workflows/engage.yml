name: Engage & Follow Back

on:
  schedule:
    # 2x daily — conserve X API credits
    - cron: "30 16 * * *"   # 11:30am EST
    - cron: "30 23 * * *"   # 6:30pm EST
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - engage
          - follow-back
      mode:
        description: "Engagement mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - commentary
          - mentions
          - thread
      count:
        description: "Posts per mode"
        required: false
        default: "2"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Random delay (0-5 min)
        run: |
          DELAY=$((RANDOM % 300))
          echo "Sleeping ${DELAY}s..."
          sleep $DELAY

      - name: Post engagement tweets
        if: inputs.task != 'follow-back'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ENGAGE_MODE: ${{ inputs.mode || 'all' }}
          ENGAGE_COUNT: ${{ inputs.count || '2' }}
        run: node scripts/engage-replies.mjs "$ENGAGE_MODE" "$ENGAGE_COUNT"

      - name: Auto follow back
        if: inputs.task != 'engage'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/auto-follow-back.mjs

      - name: Commit state files
        run: |
          git config user.name "Foxfire Auto-Explore"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/.replied-tweets.json scripts/.follow-back-state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update engagement state files"
            for attempt in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; sleep 5; continue; }
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            echo "State file push failed after 3 attempts (non-critical)"
          fi

      - name: Close stale failure issues on success
        if: success()
        run: |
          gh issue list --label "automation-failure" --state open --json number,title \
            --jq '.[] | select(.title | contains("Engage")) | .number' \
          | xargs -I{} gh issue close {} --comment "Auto-closed: workflow succeeded on $(date -u +%Y-%m-%d)" \
          2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          EXISTING=$(gh issue list --label "automation-failure" --state open --json title \
            --jq '[.[] | select(.title | contains("Engage"))] | length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open failure issue already exists, skipping duplicate"
          else
            gh issue create \
              --title "🔴 ${{ github.workflow }} failed ($(date -u +%Y-%m-%d))" \
              --body "**Workflow:** ${{ github.workflow }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n**Time:** $(date -u)\n**Trigger:** ${{ github.event_name }}" \
              --label "automation-failure" \
              2>/dev/null || echo "Could not create issue (label may not exist yet)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
